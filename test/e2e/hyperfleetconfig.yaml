apiVersion: hyperfleet.redhat.com/v1alpha1
kind: HyperFleetConfig
metadata:
  name: cluster
spec:
  bundle: cloud-capi
  api:
    database:
      secretRef:
        name: hyperfleet-db
  authentication:
    audience: hyperfleet-api
    identityProviders:
      - issuer: https://idcs-example.identity.oraclecloud.com
        tenantDimensions:
          tenancy_ocid:
            claim: tenancy_ocid
