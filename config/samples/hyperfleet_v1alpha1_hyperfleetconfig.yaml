apiVersion: hyperfleet.redhat.com/v1alpha1
kind: HyperFleetConfig
metadata:
  labels:
    app.kubernetes.io/name: hyperfleet-operator
    app.kubernetes.io/managed-by: kustomize
  # HyperFleetConfig is a cluster-scoped singleton; the only permitted name is
  # "cluster". It has no namespace.
  name: cluster
spec:
  # bundle selects the deployment shape. It is immutable after creation.
  # One of: cloud-capi, onprem-agent.
  bundle: cloud-capi
  api:
    # database.secretRef points at a Secret in the operator's namespace holding
    # keys: db.host, db.port, db.name, db.user, db.password.
    database:
      secretRef:
        name: hyperfleet-db
    # profile is a sizing hint. One of: small (default), medium, large.
    profile: small
  # authentication declares audience and identity providers. Required.
  authentication:
    audience: hyperfleet-api
    identityProviders:
      - issuer: https://idcs-example.identity.oraclecloud.com
        # identityClaim and tenantDimensions are per-provider overrides.
        tenantDimensions:
          tenancy_ocid:
            claim: tenancy_ocid
      - issuer: https://idcs-example-2.identity.oraclecloud.com
        identityClaim: preferred_username
        tenantDimensions:
          tenancy_ocid:
            value: ocid1.tenancy.oc1..aaaa
          compartment_id:
            claim: compartment_id
